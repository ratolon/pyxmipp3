name: Build and test

on:
  pull_request:

  workflow_dispatch:

jobs:
  build_with_pip:
    name: pip
    strategy:
      matrix:
        os:
        - macos-latest
        #- windows-latest
        python-version:
        - '3.10'
  
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Upgrade pip
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pip install --upgrade pip packaging

      - name: Setup PATH for Homebrew (Only macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install dependencies (Only macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install pkg-config cmake 
          brew install hdf5 fftw libtiff jpeg zstd szip
        
      - name: Debug macOS libs
        if: matrix.os == 'macos-latest'
        run: |
          for lib in hdf5 fftw libtiff jpeg; do
            echo "=== $lib ==="
            file $(brew --prefix $lib)/lib/*.dylib | head -n 3
          done

      - name: Install with pip (only macOS)
        if: matrix.os == 'macos-latest'
        env:
          CMAKE_OSX_ARCHITECTURES: arm64
          CMAKE_PREFIX_PATH: /opt/homebrew
          LDDFLAGS: "-L/opt/homebrew/lib -lzstd -lszip -ljpeg -ltiff -lfftw3 -lhdf5"
          CPPFLAGS: "-I/opt/homebrew/include"
        run: pip install . -v
        
      - name: Inspect xmippLib
        if: runner.os == 'macOS'
        run: |
          otool -L $(python - <<'EOF'
          import xmippLib, inspect, os
          print(os.path.abspath(inspect.getfile(xmippLib)))
          EOF
          )

      - name: Install with pip (non macOS)
        if: matrix.os != 'macos-latest'
        run: pip install . -v

      - name: Test installation 
        run: python -c "import xmippLib"
      
name: Build and test

on:
  pull_request:

  workflow_dispatch:

jobs:
  build_with_cmake:
    name: CMake
    strategy:
      matrix:
        os:
        - ubuntu-latest
        compiler: 
        - {cc: gcc, cxx: g++}
        - {cc: clang, cxx: clang++}
        
        #include:
        #- os: macos-latest
        #  compiler: {cc: clang, cxx: clang++}
        #- os: windows-latest
        #  compiler: {cc: cl, cxx: cl}
          
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: Debug
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: |
          pip install numpy
        
      - name: Configure and build with CMake
        uses: threeal/cmake-action@v2
        with:
          source-dir: ${{ github.workspace }}
          build-dir: "${{ github.workspace }}/build"
          c-compiler: ${{ matrix.compiler.cc }}
          cxx-compiler: ${{ matrix.compiler.cxx }}
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          run-build: true
          build-args: --config ${{ env.BUILD_TYPE }}

  build_with_pip:
    name: pip
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - ubuntu-22.04
        - macos-latest
        #- windows-latest
        python-version:
        - '3.10'
  
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Upgrade pip
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pip install --upgrade pip packaging

      - name: Setup Homebrew (Only macOS)
        if: runner.os == 'macOS'
        uses: Homebrew/install-homebrew@v2
        with:
          install-path: /opt/homebrew

      - name: Setup PATH for Homebrew (Only macOS)
        if: runner.os == 'macOS'
        run: |
          if [[ "$uname -m)" == "arm64" ]]; then
            echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $GITHUB_ENV
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            echo 'eval "$(/usr/local/bin/brew shellenv)"' >> $GITHUB_ENV
            eval "$(/usr/local/bin/brew shellenv)"
          fi

      - name: Install dependencies (Only macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config cmake hdf5 fftw jpeg libtiff

      - name: Install with pip (only macOS)
        if: runner.os == 'macOS'
        env:
          CMAKE_OSX_ARCHITECTURES: "arm64"
          CMAKE_PREFIX_PATH: /opt/homebrew
        run: pip install . -v
      
      - name: Debug macOS libs
        if: runner.os == 'macOS'
        run: |
          for lib in hdf5 fftw libtiff jpeg; do
            echo "=== $lib ==="
            file $(brew --prefix $lib)/lib/*.dylib | head -n 3
          done

      - name: Install with pip (non macOS)
        if: runner.os != 'macOS'
        run: pip install . -v

      - name: Test installation
        run: python -c "import xmippLib"
      
name: Build and test

on:
  pull_request:

  workflow_dispatch:

jobs:
  build_with_pip:
    name: pip
    strategy:
      matrix:
        os:
        - macos-latest
        #- windows-latest
        python-version:
        - '3.10'
  
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Upgrade pip
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pip install --upgrade pip packaging

      - name: Setup PATH for Homebrew (Only macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install brew dependencies (Only macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install pkg-config cmake 
          brew install fftw libtiff jpeg zstd
      
      - name: Install ARM64 HDF5 without szip (only macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          PREFIX=$GITHUB_WORKSPACE/hdf5
          mkdir -p $PREFIX
          export CMAKE_PREFIX_PATH=$PREFIX
          export LDFLAGS="-L$PREFIX/lib"
          export CPPFLAGS="-I$PREFIX/include"

          curl -LO https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.14/hdf5-1.14.3/src/hdf5-1.14.3.tar.gz
          tar xf hdf5-1.14.3.tar.gz
          cd hdf5-1.14.3

          ./configure --prefix=$PREFIX --enable-threadsafe --with-pthread --disable-szlib
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..
        
      - name: Debug macOS libs
        if: matrix.os == 'macos-latest'
        run: |
          for lib in hdf5 fftw libtiff jpeg; do
            echo "=== $lib ==="
            file $(brew --prefix $lib)/lib/*.dylib | head -n 3
          done

      - name: Install with pip (only macOS)
        if: matrix.os == 'macos-latest'
        env:
          CMAKE_OSX_ARCHITECTURES: arm64
          CMAKE_PREFIX_PATH: /opt/homebrew

          # Flags for CMake to find Homebrew libs
          LDDFLAGS: "-L/opt/homebrew/lib -lzstd -lz -ljpeg -ltiff -lfftw3 -lhdf5"
          CPPFLAGS: "-I/opt/homebrew/include"
        run: pip install . -v

      - name: Show CMake configuration
        if: matrix.os == 'macos-latest'
        run: |
          cmake -LAH . | grep -i szip

      - name: Inspect xmippLib
        if: runner.os == 'macOS'
        run: |
          DYLD_PRINT_LIBRARIES=1 python -c "import xmippLib"
          otool -L "$(python -c "import xmippLib,inspect,os; print(os.path.abspath(inspect.getfile(xmippLib)))")"

      - name: Install with pip (non macOS)
        if: matrix.os != 'macos-latest'
        run: pip install . -v

      - name: Test installation 
        run: python -c "import xmippLib"
      